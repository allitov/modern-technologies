<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!-- Диалог «История выдач» — перевод HistoryDialog -->
<head th:replace="~{fragments/layout :: head('Стоп-кадр — История выдач')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('assets')}"></header>

<main class="content">
    <!-- Метка техники «инв. номер — модель» -->
    <div class="page-title" th:text="${assetLabel}"></div>

    <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>

    <!-- Таблица DataTable: Фотограф, Выдано, Возвращено, Статус (бейдж) -->
    <table class="data-table">
        <thead>
        <tr>
            <th>Фотограф</th>
            <th>Выдано</th>
            <th>Возвращено</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${rows}">
            <td th:text="${e.employeeName}"></td>
            <td th:text="${e.issuedDate}"></td>
            <td th:text="${e.returnedDate}"></td>
            <td>
                <span th:class="${e.active} ? 'badge accent' : 'badge muted'"
                      th:text="${e.active} ? 'Активна' : 'Возвращена'"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(rows)}">
            <td colspan="4" class="empty">Здесь пока пусто</td>
        </tr>
        </tbody>
    </table>

    <div class="toolbar">
        <a class="btn secondary" th:href="@{/assets}">Закрыть</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
