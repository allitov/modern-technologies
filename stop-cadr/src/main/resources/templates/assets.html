<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!-- Вкладка «Техника» — перевод AssetsTab -->
<head th:replace="~{fragments/layout :: head('Стоп-кадр — Техника')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('assets')}"></header>

<main class="content">
    <div class="toolbar">
        <!-- Фильтр: Все / В стойке / На съёмке — перевод Fl_Choice -->
        <form th:action="@{/assets}" method="get">
            <select name="filter" onchange="this.form.submit()">
                <option th:each="f : ${filters}" th:value="${f}" th:text="${f}"
                        th:selected="${f == filter}"></option>
            </select>
        </form>
        <button type="button" class="btn primary" onclick="issueSelected()">Выдать</button>
        <button type="button" class="btn secondary" onclick="returnSelected()">Принять</button>
        <span class="spacer"></span>
        <button type="button" class="btn primary" onclick="openDialog('add-asset-dialog')">+ Техника</button>
        <button type="button" class="btn secondary" onclick="editSelected()">Изменить</button>
    </div>

    <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>

    <!-- Таблица DataTable: ID, Инв.№, Модель, Категория, Статус (бейдж), У кого -->
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Инв.№</th>
            <th>Модель</th>
            <th>Категория</th>
            <th>Статус</th>
            <th>У кого</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}" th:attr="data-id=${r.asset.id}">
            <td th:text="${r.asset.id}"></td>
            <td th:text="${r.asset.inventoryNumber}"></td>
            <td th:text="${r.asset.model}"></td>
            <td th:text="${r.asset.category}"></td>
            <td>
                <span th:class="${r.asset.assigned} ? 'badge accent' : 'badge success'"
                      th:text="${r.asset.assigned} ? 'На съёмке' : 'В стойке'"></span>
            </td>
            <td th:text="${#strings.isEmpty(r.holder)} ? '—' : ${r.holder}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(rows)}">
            <td colspan="6" class="empty">Нет техники</td>
        </tr>
        </tbody>
    </table>
</main>

<!-- Диалог «Новая техника» — перевод AssetDialog в режиме добавления -->
<dialog id="add-asset-dialog" class="modal">
    <form th:action="@{/assets/add}" method="post">
        <div class="modal-header">Новая техника</div>
        <div class="modal-content">
            <label class="field" for="add-inv">Инвентарный номер</label>
            <input type="text" id="add-inv" name="inventoryNumber">
            <label class="field" for="add-model">Модель</label>
            <input type="text" id="add-model" name="model">
            <label class="field" for="add-cat">Категория</label>
            <select id="add-cat" name="category">
                <option>Камера</option>
                <option>Объектив</option>
                <option>Вспышка</option>
                <option>Штатив</option>
                <option>Свет</option>
                <option>Другое</option>
            </select>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn secondary" onclick="closeDialog('add-asset-dialog')">Отмена</button>
            <button type="submit" class="btn primary">Сохранить</button>
        </div>
    </form>
</dialog>

<!-- Диалог выдачи техники — перевод IssueDialog -->
<dialog id="issue-dialog" class="modal">
    <form th:action="@{/assets/issue}" method="post" onsubmit="return validateIssue()">
        <div class="modal-header">Выдача техники</div>
        <div class="modal-content">
            <label class="field" for="issue-employee">Фотограф</label>
            <select id="issue-employee" name="employeeId">
                <option th:each="e : ${activeEmployees}" th:value="${e.id}"
                        th:text="${e.fullName}"></option>
            </select>
            <label class="field" for="issue-asset">Техника</label>
            <select id="issue-asset" name="assetId">
                <option th:each="a : ${freeAssets}" th:value="${a.id}"
                        th:text="${a.inventoryNumber + ' — ' + a.model}"></option>
            </select>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn secondary" onclick="closeDialog('issue-dialog')">Отмена</button>
            <button type="submit" class="btn primary">Сохранить</button>
        </div>
    </form>
</dialog>

<!-- Скрытая форма возврата для кнопки «Принять» тулбара -->
<form id="return-form" th:action="@{/assets/return}" method="post">
    <input type="hidden" name="assetId">
</form>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    // Перевод выбора строки DataTable: клик — выбор.
    let selectedId = null;
    document.querySelectorAll('tr[data-id]').forEach(tr => {
        tr.addEventListener('click', () => {
            document.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
            tr.classList.add('selected');
            selectedId = tr.dataset.id;
        });
    });

    // Перевод AssetsTab::issueCb / returnCb / editCb: без выбранной строки — fl_alert.
    function requireSelection() {
        if (selectedId === null) { alert('Выберите технику'); return false; }
        return true;
    }

    // Перевод AssetsTab::doIssue: диалог заполняется списками активных
    // фотографов и свободной техники, выбранная строка не используется.
    function issueSelected() {
        if (!requireSelection()) return;
        openDialog('issue-dialog');
    }

    // Перевод AssetsTab::doReturn: подтверждение fl_choice перед возвратом.
    function returnSelected() {
        if (!requireSelection()) return;
        if (!confirm('Принять технику обратно в стойку?')) return;
        document.querySelector('#return-form input[name="assetId"]').value = selectedId;
        document.getElementById('return-form').submit();
    }

    // В C++-версии диалог редактирования техники (AssetsTab::doEdit) открывается
    // с пустым обработчиком сохранения, поэтому отдельной страницы нет.
    function editSelected() {
        if (!requireSelection()) return;
    }

    // Перевод IssueDialog::okCb.
    function validateIssue() {
        if (document.getElementById('issue-employee').options.length === 0) {
            alert('Нет фотографов в штате');
            return false;
        }
        if (document.getElementById('issue-asset').options.length === 0) {
            alert('Вся техника занята');
            return false;
        }
        return true;
    }

    function openDialog(id) { document.getElementById(id).showModal(); }
    function closeDialog(id) { document.getElementById(id).close(); }
</script>
</body>
</html>
