name: Data Converter CI

on:
  push:
    paths:
      - 'data-converter/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/data-converter-ci.yml'
  pull_request:
    paths:
      - 'data-converter/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/data-converter-ci.yml'

jobs:
  build-and-test:
    name: Build and test data-converter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up build environment (JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle (cache and wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bash ./gradlew :data-converter:dependencies --configuration runtimeClasspath

      - name: Build application
        run: bash ./gradlew :data-converter:assemble

      - name: Run tests
        run: bash ./gradlew :data-converter:test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-converter-test-reports-${{ matrix.os }}
          path: data-converter/build/reports/tests/test
          retention-days: 7
